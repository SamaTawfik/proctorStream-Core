version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: proctor_postgres
    environment:
      POSTGRES_USER: proctor_user
      POSTGRES_PASSWORD: proctor_password
      POSTGRES_DB: proctor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: proctor_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: proctor_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: